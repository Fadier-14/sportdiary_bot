<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
    background: #000000;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
}

#zag {
    padding: 24px 16px 12px;
}

#zag h1 {
    font-size: 34px;
    font-weight: 700;
    margin: 0 0 6px 0;
}

#zag h2 {
    font-size: 16px;
    font-weight: 400;
    color: #8e8e93;
    margin: 0;
}

.floor {
    background: #1c1c1e;
    position: fixed;
    bottom: 16px;
    left: 16px;
    right: 16px;
    border-radius: 24px;
    display: flex;
    padding: 8px 0 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 100;
}

.btn-floor,
.active-btn-floor {
    flex: 1;
    text-align: center;
    border: none;
    outline: none;
    background: none;
    position: relative;
    padding: 6px 0 12px;
    font-size: 10px;
    transition: color 0.25s ease;
    cursor: pointer;
}

.btn-floor { color: #8e8e93; }
.active-btn-floor { color: #a78bfa; }

.btn-floor::after,
.active-btn-floor::after {
    content: "";
    position: absolute;
    bottom: 6px;
    left: 25%;
    width: 50%;
    height: 3px;
    background: #a78bfa;
    border-radius: 3px;
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.3s ease;
}

.active-btn-floor::after { transform: scaleX(1); }

.date {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 16px 12px;
    font-size: 22px;
    font-weight: 600;
}

.date button {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 28px;
    cursor: pointer;
    padding: 0 12px;
}

.day_ned {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: #8e8e93;
    font-size: 12px;
    font-weight: 600;
    margin: 4px 12px 12px;
    letter-spacing: 0.5px;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    padding: 0 12px 120px;
}

.day-btn {
    background: #1c1c1e;
    position: relative;
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    aspect-ratio: 1;
    cursor: pointer;
    transition: all 0.2s ease;
}

.dot {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #6d28d9;
    opacity: 0;
    transition: opacity 0.2s;
}

.day-btn.show .dot {
    opacity: 1;
}

.day-btn:active {
    background: #2c2c2e;
    transform: scale(0.96);
}

.display_lobby,
.display_plan,
.display_stat,
.display_prof {
    visibility: hidden;
    position: absolute;
    width: 100%;
    top: 0;
}

.display_lobby {
    visibility: visible;
    position: relative;
}

.modal,
.modal_add_treing,
.add_uprach {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: flex-end;
}

.add_uprach { z-index: 1100; }

.modal.show,
.modal_add_treing.show,
.add_uprach.show {
    display: flex;
}

.modal-content,
.add_uprach_content {
    background: #1c1c1e;
    width: 100%;
    max-height: 85vh;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 32px;
    box-sizing: border-box;
    animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    overflow-y: auto;
}

.modal-simple {
    max-width: 340px;
    margin: 0 auto 20px;
    padding: 20px;
    gap: 12px;
    display: flex;
    flex-direction: column;
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}

#add_tr {
    font-size: 22px;
    font-weight: 700;
    display: block;
    margin-bottom: 16px;
}

.modal-content span,
.add_uprach_content span {
    display: block;
    margin: 14px 0 6px;
    font-size: 13px;
    color: #8e8e93;
    font-weight: 500;
}

.modal-content input,
.modal-content select,
.add_uprach_content input,
.add_uprach_content select {
    width: 100%;
    padding: 14px 16px;
    background: #2c2c2e;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    box-sizing: border-box;
    margin-bottom: 4px;
}

#add_upr {
    width: 100%;
    padding: 14px;
    background: #2c2c2e;
    color: #a78bfa;
    border: 1px dashed #3a3a3c;
    border-radius: 14px;
    font-size: 15px;
    margin: 8px 0 16px;
    cursor: pointer;
}

#upr_list div {
    background: #2c2c2e;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 15px;
}

#modal-closest,
#modal-closest_add_treing,
#add_u,
#modal_saves,
#add_treing {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

#modal-closest,
#modal-closest_add_treing {
    background: #2c2c2e;
    color: white;
    margin-top: 8px;
}

#modal-closest:active,
#modal-closest_add_treing:active {
    background: #3a3a3c;
}

#add_u,
#modal_saves,
#add_treing {
    background: #7c3aed;
    color: white;
}

#modal_saves {
    margin-top: 12px;
    margin-bottom: 8px;
}

#add_u:active,
#modal_saves:active,
#add_treing:active {
    background: #6d28d9;
}
#traing_list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px 0 16px;
}

#traing_list > div {
    background: #2c2c2e;
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

#traing_list span {
    font-size: 14px;
    color: #e5e5ea;
    line-height: 1.4;
}

#traing_list span:first-child {
    font-weight: 600;
    color: #a78bfa;
    font-size: 15px;
}
.change {
    display: none;
    position: absolute;
    background: #2c2c2e;
    border-radius: 16px;
    padding: 8px;
    gap: 6px;
    z-index: 2000;          
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    flex-direction: column;
    min-width: 140px;
}

.change.show {
    display: flex;
}

.change button {
    background: #3a3a3c;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
}

.change button:active {
    background: #48484a;
}

#delete_treing {
    color: #ff453a;
}
    </style>
    
</head>
<body>
    <div class="display_lobby" id="display_lobby1">
    <div id="zag">
        <h1>Привет!</h1>
        <h2>Готов к очередной тренировке?</h2>
    </div>
    <div class="t_w">
        <span>📅 Сегодняшняя тренировка</span>
    </div>
    </div>
    <div class="display_plan" id="display_plan1">
        <div class="date">
            <button id="mounth_left"><</button>
            <div id="mounth">Ноябрь</div>
            <div id="year">2026</div>
            <button id="mounth_right">></button>
        </div>
        <div class="day_ned">
                <span>ПН</span>
                <span>ВТ</span>
                <span>СР</span>
                <span>ЧТ</span>
                <span>ПТ</span>
                <span>СБ</span>
                <span>ВС</span>
        </div>
        <div class="calendar">
            
        </div>
    </div>
    <div class="display_stat" id="display_stat1">

    </div>
    <div class="display_prof" id="display_prof1">

    </div>
    <div class="floor">
        <button class="active-btn-floor" id="lobby">🏠︎<br>Лобби</button>
        <button class="btn-floor" id="plan">🏋️<br>План тренировок</button>
        <button class="btn-floor" id="stat">📊<br>Статистика</button>
        <button class="btn-floor" id="prof">👤<br>Профиль</button>
    </div>
    <div class="modal" id="modal">
        <div class="modal-content modal-simple">
            <span id="day-bnt-data"></span>
            <div id="traing_list">
                
            </div>
            <button id="add_treing">Добавить тренировку</button>
            <button id="modal-closest">Закрыть</button>
        </div>
    </div>
    <div class="modal_add_treing" id="modal_add_treing">
        <div class="modal-content">
            <span id="add_tr">Добавить тренировку</span>
            <span>тип тренировки</span>
            <select id="type_tr">
                <option value="none">Пусто</option>
                <option value="Спортзал">Зал</option>
                <option value="Спорт">Спорт</option>
            </select>
            <span>Название</span>
            <select id="name_tr">

            </select>
            <span>Время</span>
            <input type="time" id="time_tr" placeholder="Время начала тренировки">
            <span>Упражнения</span>
            <button type="button" id="add_upr">+ добавить упражнение</button>
            <div id="upr_list"></div>
            <button id="modal_saves">сохранить</button>
            <button id="modal-closest_add_treing">отмена</button>
        </div>
    </div>
    <div class="add_uprach" id="add_uprach">
        <div class="add_uprach_content">
            <input type="text" id="upr_name" placeholder="название упражнения">
            <span>Количество подходов</span>
            <select id="podhod">
                
            </select>
            <span>Количество повторений</span>
            <select id="povtor">

            </select>
            <button id="add_u">Добавить</button>
        </div>
    </div>
    <div id="change" class="change">
        <button id="delete_treing">Удалить</button>
        <button id="change_treing">Изменить</button>
        <button id="cancellation">Отмена</button>
    </div>
    
    <script>
        const modal_add_treing = document.querySelector(".modal_add_treing")
        const modal = document.querySelector(".modal")
        const API = "https://unroll-drivable-majorette.ngrok-free.dev"
        const tg = window.Telegram && window.Telegram.WebApp;
        let selectedTrainingId = null;
        document.getElementById("cancellation").onclick = function() {
    document.getElementById("change").classList.remove("show");
};

        document.getElementById("add_treing").onclick = function() {
        
        modal_add_treing.classList.add("show")
        modal.classList.remove("show")
        }
        let id_day = ""
        
        async function day_btn_inf(dayID) {
    if (!tg || !tg.initData) return;

    const res3 = await fetch(API + "/day_btn_inf", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            initData: tg.initData,
            data: dayID
        })
    });
    document.getElementById("day-bnt-data").textContent = dayID
    const data3 = await res3.json();
    const traing_list = document.getElementById("traing_list")
    if (data3.ok) {
        traing_list.innerHTML = ""
        for (let i = 0; i < data3.traing_info.length; i++) {

            const treing = document.createElement("div")
            treing.className = "treing_on_day"
        const span = document.createElement("span")
        span.textContent = "Тип тренировки:" + " " + data3.traing_info[i].type
        const span2 = document.createElement("span")
        span2.textContent = "Название:" + " " +data3.traing_info[i].name
        const span3 = document.createElement("span")
        span3.textContent = "Время:" + " " + data3.traing_info[i].time
        const span4 = document.createElement("span")
        span4.textContent = "Упражнения:" + " " + data3.traing_info[i].exercise
        const id_treing = data3.traing_info[i].id_treing
        treing.dataset.id = id_treing
        
        treing.append(span)
        treing.append(span2)
        treing.append(span3)
        treing.append(span4)
        traing_list.append(treing)
        }
        

    }
}
const treing_on_day = document.getElementById("traing_list")
const change_container = document.querySelector(".change")
const changeMenu = document.getElementById("change")
treing_on_day.addEventListener("click", function(event) {
    const treing_on_day_click = event.target.closest(".treing_on_day")
    if (!treing_on_day_click) return
    
    selectedTrainingId = treing_on_day_click.dataset.id;

    const rect = treing_on_day_click.getBoundingClientRect();
    changeMenu.style.top = (rect.top + rect.height / 2 - 40) + "px";
    changeMenu.style.left = (rect.left + rect.width / 2 - 70) + "px";

    changeMenu.classList.add("show");
})
document.getElementById("delete_treing").onclick = async function delete_treing() {
        if (!tg || !tg.initData) return;
        const res4 = await fetch(API + "/delete_treing", {
            method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ initData: tg.initData,
                treing_id: selectedTrainingId
                })
                
        })
        const data4 = await res4.json()
        if (data4.ok) {
            document.getElementById("change").classList.remove("show");
            day_btn_inf(id_day);
        }
}
        async function tr_show() {
            if (!tg || !tg.initData) return;
            const res2 = await fetch(API + "/show_tr", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ initData: tg.initData})
            })
            const data2 = await res2.json();
            if (data2.ok) {
                const tr_ids = data2.traing
                for (i = 0; i < tr_ids.length ; i++) {
                    const tr_id = document.getElementById(tr_ids[i])
                    if (tr_id) {
                        tr_id.classList.add("show")
                    }
                }
            }
        }
        
        if (tg) {
            tg.ready();
            tr_show()


        }
        document.getElementById("add_upr").onclick = function() {
            document.getElementById("add_uprach").classList.add("show")
        }
        for (o = 1; o <= 100; o++) {
            const podhod_select = document.getElementById("podhod")
            const podhod_option = document.createElement("option")
            podhod_option.textContent = o
            podhod_select.append(podhod_option)

        }
        for (o = 1; o <= 100; o++) {
            const povtor_select = document.getElementById("povtor")
            const povtor_option = document.createElement("option")
            povtor_option.textContent = o
            povtor_select.append(povtor_option)

        }
        document.getElementById("add_u").onclick = function() {
            const upr_list = document.getElementById("upr_list")
            const name = document.getElementById("upr_name").value
            const sets = document.getElementById("podhod").value
            const reps = document.getElementById("povtor").value

            if (!name) return;

            const list = document.createElement("div")
            list.textContent = name + "-" + sets + "x" + reps
            document.getElementById("upr_list").append(list)
            document.getElementById("upr_name").value = ""
            document.getElementById("add_uprach").classList.remove("show")

        }
        function name_tr_select() {
            const selected = document.getElementById("type_tr").value;
            const nameSelect = document.getElementById("name_tr")
        const select_gym = ["День ног", "День рук", "День спины", "День груди"]
        const select_sport = ["Футбол", "Баскетбол", "Бег", "Плавание"]
                nameSelect.innerHTML = ""
                if (selected === "Спортзал") {
                    select_gym.forEach(function(name) {
                const option = document.createElement("option")
                option.textContent = name
                nameSelect.append(option)
            })
                    
                }
                if (selected === "Спорт") {
                    select_sport.forEach(function(name) {
                        const option = document.createElement("option")
                        option.textContent = name
                        nameSelect.append(option)
                    })
                }
            }
            
        document.getElementById("type_tr").addEventListener("change", function(){
            
            
            
            name_tr_select()
            
        })
        
        
        const calendarContainer = document.querySelector(".calendar")
        calendarContainer.addEventListener("click", function(event){
            const day = event.target.closest(".day-btn")
            if (!day) return;
            modal.classList.add("show")
            id_day = day.id;

            
            day_btn_inf(id_day)
            document.getElementById("add_tr").textContent = "Добавить тренировку" + " " + id_day

        })
        document.getElementById("modal_saves").onclick = function() {
            const type_train = document.getElementById("type_tr").value
            const name_train = document.getElementById("name_tr").value
            const time_train = document.getElementById("time_tr").value
            const date_train = id_day
            const exercises_train = document.getElementById("upr_list").innerText
            
            
            async function SendPass() {
                
    if (!tg || !tg.initData) return;
    const res = await fetch(API + "/add_tr", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            initData: tg.initData,
            type: type_train,
            name: name_train,
            time: time_train,
            data: date_train,
            exercises: exercises_train
        })
    });
    const data = await res.json();
    if (data.ok) {
        modal_add_treing.classList.remove("show")
        document.getElementById("upr_list").innerHTML = ""
        tr_show()
    }
}


SendPass();


}
        document.getElementById("modal-closest").onclick = function() {
            modal.classList.remove("show")
            
        }
        document.getElementById("modal-closest_add_treing").onclick = function() {
            modal_add_treing.classList.remove("show")
            document.getElementById("upr_list").innerHTML = ""
        }
        const floorContainer = document.querySelector(".floor");
        floorContainer.addEventListener("click", function(event){
            const btn_click = event.target.closest('button')
            if (!btn_click) return
            const oldActive = floorContainer.querySelector('.active-btn-floor');
            if (oldActive) {
                oldActive.classList.replace('active-btn-floor', 'btn-floor')
                
            }
            btn_click.classList.replace('btn-floor', 'active-btn-floor')

            const btn_id = btn_click.id;

            if (btn_id == "lobby") {
                document.getElementById("display_lobby1").style.visibility = "visible";
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "hidden";
                document.getElementById("display_prof1").style.visibility = "hidden";
            }
            else if (btn_id == "plan") {
                document.getElementById("display_lobby1").style.visibility = "hidden";   
                document.getElementById("display_plan1").style.visibility = "visible";
                document.getElementById("display_stat1").style.visibility = "hidden";    
                document.getElementById("display_prof1").style.visibility = "hidden";    
            }
            else if (btn_id == "stat") {
                document.getElementById("display_lobby1").style.visibility = "hidden";  
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "visible";   
                document.getElementById("display_prof1").style.visibility = "hidden";   
            }
            else if (btn_id == "prof") {
                document.getElementById("display_lobby1").style.visibility = "hidden";  
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "hidden";   
                document.getElementById("display_prof1").style.visibility = "visible";   
            }
        })
        
        let mounth_num = 11
        let year = 2026
        const calendar = document.querySelector(".calendar")
        const mounth = document.getElementById("mounth");
        function updateMounth() {
        if (mounth_num === 1) {
            mounth.textContent = "Январь"
        }
        if (mounth_num === 2) {
            mounth.textContent = "Февраль"
        }
        if (mounth_num === 3) {
            mounth.textContent = "Март"
        }
        if (mounth_num === 4) {
            mounth.textContent = "Апрель"
        }
        if (mounth_num === 5) {
            mounth.textContent = "Май"
        }
        if (mounth_num === 6) {
            mounth.textContent = "Июнь"
        }
        if (mounth_num === 7) {
            mounth.textContent = "Июль"
        }
        if (mounth_num === 8) {
            mounth.textContent = "Август"
        }
        if (mounth_num === 9) {
            mounth.textContent = "Сентябрь"
        }
        if (mounth_num === 10) {
            mounth.textContent = "Октябрь"
        }
        if (mounth_num === 11) {
            mounth.textContent = "Ноябрь"
        }
        if (mounth_num === 12) {
            mounth.textContent = "Декабрь"
        }
        document.getElementById("year").textContent = year

        calendar.innerHTML = ""
        const kolvo = new Date(year, mounth_num, 0).getDate();
        let startDay = new Date(year, mounth_num - 1, 1).getDay();
        if (startDay === 0) startDay = 7;
        const pust = startDay - 1
        for (let m = 1; m <= pust; m++) {
            const pust_div = document.createElement("div")
            calendar.append(pust_div)
        }

        

        for (let i = 1; i <= kolvo; i++) {
            const button = document.createElement("button")
            button.textContent = i
            button.className = "day-btn";
            button.id = i + " " + mounth_num + " " + year
            const dot = document.createElement("span")
            dot.className = "dot";
            button.append(dot)

        calendar.append(button);
        }

        }
        
        
        document.getElementById("mounth_right").onclick = function() {
            if (mounth_num === 12) {
                mounth_num = 1;
                year += 1

            }
        
            
            else {mounth_num += 1}
            
            updateMounth()
            tr_show()
        }
        document.getElementById("mounth_left").onclick = function() {
            if (mounth_num === 1) {
                mounth_num = 12;
                year -= 1
            }
            else {mounth_num -= 1}

            

            updateMounth()
            tr_show()
            
        }
        updateMounth()
        name_tr_select()
        
        
    </script>
    
</body>





</html>
