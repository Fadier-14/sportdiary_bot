<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            background: black;
        }
        #zag {
            margin-top: 0;
        }
        #zag h1 {
            font-size: 30px;
            text-align: left;
            font-weight: 400;
            color: white;
        }
        #zag h2 {
            font-size: 16px;
            text-align: left;
            color: #3a3a3c;
        }
        .floor {
            background: #222222;
            color: #3a3a3c;
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            border: #222222 solid 1px;
            border-radius: 15px;
            display: flex;
            
        }
        .active-btn-floor {
            flex: 1;
            text-align: center;
            color: #6d28d9;
            border: none;
            outline: none;
            background: none;
            position: relative;
            padding-bottom: 8px;
            padding-top: 8px;
            transition: color 0.4s ease;
            font-size: 12px;
        }
        .btn-floor::after,
        .active-btn-floor::after {
        content: "";                 
        position: absolute;          
        bottom: 0;                   
        left: 15%;                   
        width: 70%;                
        height: 3px;   
        background-color: #6d28d9;
        border-radius: 2px;
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 0.4s ease;
        }
        .active-btn-floor::after {
            transform: scaleX(1);
        }
        .btn-floor {
            flex: 1;
            text-align: center;
            color: #3a3a3c;
            border: none;
            outline: none;
            background: none;
            position: relative;
            padding-bottom: 8px;
            padding-top: 8px;
            transition: color 0.4s ease;
            font-size: 12px;

        }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .display_lobby {
            visibility: visible;
        }
        .display_plan {
            visibility: hidden;
        }
        .display_stat {
            visibility: hidden;
        }
        .display_prof {
            visibility: hidden;
        }
        .day-btn {
            background: #222222;
            color: white;
            border-radius: 8px;
            border: 0px;
            font-size: 16px;
            aspect-ratio: 1;
        }
        .day_ned {
            color: #3a3a3c;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-top: 8px;
            text-align: center;
        }
    </style>
    
</head>
<body>
    <div class="display_lobby" id="display_lobby1">
    <div id="zag">
        <h1>Привет!</h1>
        <h2>Готов к очередной тренировке?</h2>
    </div>
    <div class="t_w">
        <span>📅 Сегодняшняя тренировка</span>
    </div>
    </div>
    <div class="display_plan" id="display_plan1">
        <div class="day_ned">
                <span>ПН</span>
                <span>ВТ</span>
                <span>СР</span>
                <span>ЧТ</span>
                <span>ПТ</span>
                <span>СБ</span>
                <span>ВС</span>
        </div>
        <div class="calendar">
            
        </div>
    </div>
    <div class="display_stat" id="display_stat1">

    </div>
    <div class="display_prof" id="display_prof1">

    </div>
    <div class="floor">
        <button class="active-btn-floor" id="lobby">🏠︎<br>Лобби</button>
        <button class="btn-floor" id="plan">🏋️<br>План тренировок</button>
        <button class="btn-floor" id="stat">📊<br>Статистика</button>
        <button class="btn-floor" id="prof">👤<br>Профиль</button>
    </div>
    <script>
        const floorContainer = document.querySelector(".floor");
        floorContainer.addEventListener("click", function(event){
            const btn_click = event.target.closest('button')
            if (!btn_click) return
            const oldActive = floorContainer.querySelector('.active-btn-floor');
            if (oldActive) {
                oldActive.classList.replace('active-btn-floor', 'btn-floor')
                
            }
            btn_click.classList.replace('btn-floor', 'active-btn-floor')

            const btn_id = btn_click.id;

            if (btn_id == "lobby") {
                document.getElementById("display_lobby1").style.visibility = "visible";
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "hidden";
                document.getElementById("display_prof1").style.visibility = "hidden";
            }
            else if (btn_id == "plan") {
                document.getElementById("display_lobby1").style.visibility = "hidden";   
                document.getElementById("display_plan1").style.visibility = "visible";
                document.getElementById("display_stat1").style.visibility = "hidden";    
                document.getElementById("display_prof1").style.visibility = "hidden";    
            }
            else if (btn_id == "stat") {
                document.getElementById("display_lobby1").style.visibility = "hidden";  
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "visible";   
                document.getElementById("display_prof1").style.visibility = "hidden";   
            }
            else if (btn_id == "prof") {
                document.getElementById("display_lobby1").style.visibility = "hidden";  
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "hidden";   
                document.getElementById("display_prof1").style.visibility = "visible";   
            }
        })
        const calendar = document.querySelector(".calendar")
        const kolvo = new Date(2026, 11, 0).getDate()
        let StartDay = new Date(2026, 10, 1).getDay()
        if (StartDay === 0) StartDay = 7
        const pust = StartDay - 1

        for (let m = 1; m <= pust; m++) {
            const pust_div = document.createElement("div")
            calendar.append(pust_div)
        }

        

        for (let i = 1; i <= kolvo; i++) {
            const button = document.createElement("button")
            button.textContent = i
            button.className = "day-btn";
            button.id = "day-" + i
            

        calendar.append(button);
        }
    </script>
    
</body>





</html>
