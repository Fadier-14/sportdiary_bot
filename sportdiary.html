<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
    background: #000000;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
}

#zag {
    padding: 20px 16px 10px;
}

#zag h1 {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 4px 0;
}

#zag h2 {
    font-size: 16px;
    font-weight: 400;
    color: #8e8e93;
    margin: 0;
}

.floor {
    background: #1c1c1e;
    position: fixed;
    bottom: 12px;
    left: 12px;
    right: 12px;
    border-radius: 20px;
    display: flex;
    padding: 6px 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.btn-floor,
.active-btn-floor {
    flex: 1;
    text-align: center;
    border: none;
    outline: none;
    background: none;
    position: relative;
    padding: 8px 0 10px;
    font-size: 11px;
    transition: color 0.3s ease;
    cursor: pointer;
}

.btn-floor {
    color: #8e8e93;
}

.active-btn-floor {
    color: #7c3aed;
}

.btn-floor::after,
.active-btn-floor::after {
    content: "";
    position: absolute;
    bottom: 4px;
    left: 20%;
    width: 60%;
    height: 3px;
    background-color: #7c3aed;
    border-radius: 2px;
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.3s ease;
}

.active-btn-floor::after {
    transform: scaleX(1);
}

.date {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 8px;
    font-size: 20px;
    font-weight: 600;
}

.date button {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 24px;
    cursor: pointer;
    padding: 4px 16px;
}

.day_ned {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: #8e8e93;
    font-size: 13px;
    font-weight: 600;
    margin: 8px 12px 10px;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    padding: 0 12px 100px;
}

.day-btn {
    background: #1c1c1e;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    aspect-ratio: 1;
    cursor: pointer;
    transition: background 0.2s ease;
}

.day-btn:active {
    background: #2c2c2e;
}

.display_lobby,
.display_plan,
.display_stat,
.display_prof {
    visibility: hidden;
    position: absolute;
    width: 100%;
}

.display_lobby {
    visibility: visible;
    position: relative;
}
    </style>
    
</head>
<body>
    <div class="display_lobby" id="display_lobby1">
    <div id="zag">
        <h1>Привет!</h1>
        <h2>Готов к очередной тренировке?</h2>
    </div>
    <div class="t_w">
        <span>📅 Сегодняшняя тренировка</span>
    </div>
    </div>
    <div class="display_plan" id="display_plan1">
        <div class="date">
            <button id="mounth_left"><</button>
            <div id="mounth">Ноябрь</div>
            <div id="year">2026</div>
            <button id="mounth_right">></button>
        </div>
        <div class="day_ned">
                <span>ПН</span>
                <span>ВТ</span>
                <span>СР</span>
                <span>ЧТ</span>
                <span>ПТ</span>
                <span>СБ</span>
                <span>ВС</span>
        </div>
        <div class="calendar">
            
        </div>
    </div>
    <div class="display_stat" id="display_stat1">

    </div>
    <div class="display_prof" id="display_prof1">

    </div>
    <div class="floor">
        <button class="active-btn-floor" id="lobby">🏠︎<br>Лобби</button>
        <button class="btn-floor" id="plan">🏋️<br>План тренировок</button>
        <button class="btn-floor" id="stat">📊<br>Статистика</button>
        <button class="btn-floor" id="prof">👤<br>Профиль</button>
    </div>
    <script>
        
        const floorContainer = document.querySelector(".floor");
        floorContainer.addEventListener("click", function(event){
            const btn_click = event.target.closest('button')
            if (!btn_click) return
            const oldActive = floorContainer.querySelector('.active-btn-floor');
            if (oldActive) {
                oldActive.classList.replace('active-btn-floor', 'btn-floor')
                
            }
            btn_click.classList.replace('btn-floor', 'active-btn-floor')

            const btn_id = btn_click.id;

            if (btn_id == "lobby") {
                document.getElementById("display_lobby1").style.visibility = "visible";
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "hidden";
                document.getElementById("display_prof1").style.visibility = "hidden";
            }
            else if (btn_id == "plan") {
                document.getElementById("display_lobby1").style.visibility = "hidden";   
                document.getElementById("display_plan1").style.visibility = "visible";
                document.getElementById("display_stat1").style.visibility = "hidden";    
                document.getElementById("display_prof1").style.visibility = "hidden";    
            }
            else if (btn_id == "stat") {
                document.getElementById("display_lobby1").style.visibility = "hidden";  
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "visible";   
                document.getElementById("display_prof1").style.visibility = "hidden";   
            }
            else if (btn_id == "prof") {
                document.getElementById("display_lobby1").style.visibility = "hidden";  
                document.getElementById("display_plan1").style.visibility = "hidden";
                document.getElementById("display_stat1").style.visibility = "hidden";   
                document.getElementById("display_prof1").style.visibility = "visible";   
            }
        })
        
        let mounth_num = 11
        let year = 2026
        const calendar = document.querySelector(".calendar")
        const mounth = document.getElementById("mounth");
        function updateMounth() {
        if (mounth_num === 1) {
            mounth.textContent = "Январь"
        }
        if (mounth_num === 2) {
            mounth.textContent = "Февраль"
        }
        if (mounth_num === 3) {
            mounth.textContent = "Март"
        }
        if (mounth_num === 4) {
            mounth.textContent = "Аперель"
        }
        if (mounth_num === 5) {
            mounth.textContent = "Май"
        }
        if (mounth_num === 6) {
            mounth.textContent = "Июнь"
        }
        if (mounth_num === 7) {
            mounth.textContent = "Июль"
        }
        if (mounth_num === 8) {
            mounth.textContent = "Август"
        }
        if (mounth_num === 9) {
            mounth.textContent = "Сентябрь"
        }
        if (mounth_num === 10) {
            mounth.textContent = "Октябрь"
        }
        if (mounth_num === 11) {
            mounth.textContent = "Ноябрь"
        }
        if (mounth_num === 12) {
            mounth.textContent = "Декабрь"
        }
        document.getElementById("year").textContent = year

        calendar.innerHTML = ""
        const kolvo = new Date(year, mounth_num, 0).getDate();
        let startDay = new Date(year, mounth_num - 1, 1).getDay();
        if (startDay === 0) startDay = 7;
        const pust = startDay - 1
        for (let m = 1; m <= pust; m++) {
            const pust_div = document.createElement("div")
            calendar.append(pust_div)
        }

        

        for (let i = 1; i <= kolvo; i++) {
            const button = document.createElement("button")
            button.textContent = i
            button.className = "day-btn";
            button.id = "day-" + i
            

        calendar.append(button);
        }

        }
        
        
        document.getElementById("mounth_right").onclick = function() {
            if (mounth_num === 12) {
                mounth_num = 1;
                year += 1

            }
        
            
            else {mounth_num += 1}
            
            updateMounth()
        }
        document.getElementById("mounth_left").onclick = function() {
            if (mounth_num === 1) {
                mounth_num = 12;
                year -= 1
            }
            else {mounth_num -= 1}

            

            updateMounth()
            
        }
        updateMounth()
        
    </script>
    
</body>





</html>
